<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ARMIET CanteenFlow</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            min-height: 100vh;
            background: #f7f7f7;
        }

        .login-page {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border-radius: 16px;
            background: #ff6b35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .login-logo h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
        }

        .login-logo p {
            margin-top: 7px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .login-submit {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #ff6b35;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }

        .login-submit:hover {
            transform: translateY(-1px);
            background: #f25b25;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #fff0f0;
            color: #d93025;
            border: 1px solid #ffd0d0;
        }

        .success-message {
            background: #eefbf2;
            color: #188038;
            border: 1px solid #c9efd3;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .register-link a {
            color: #ff6b35;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- Logo -->

            <div class="login-logo">

                <div class="login-logo-icon">
                    🍴
                </div>

                <h1>Welcome Back</h1>

                <p>Login to your ARMIET CanteenFlow account</p>

            </div>


            <!-- Success Message -->

            <div
                th:if="${success}"
                class="message success-message"
                th:text="${success}">
            </div>


            <!-- Error Message -->

            <div
                th:if="${error}"
                class="message error-message"
                th:text="${error}">
            </div>


            <!-- Login Form -->

            <form action="/login" method="post">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit">
                    Login →
                </button>

            </form>


            <!-- Register -->

            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>


            <!-- Back -->

            <div class="back-home">

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>
</html>
