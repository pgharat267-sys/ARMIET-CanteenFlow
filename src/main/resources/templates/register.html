<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ARMIET CanteenFlow</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            min-height: 100vh;
            background: #f7f7f7;
        }

        .register-page {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .register-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-logo-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border-radius: 16px;
            background: #ff6b35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .register-logo h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
        }

        .register-logo p {
            margin-top: 7px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .register-submit {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #ff6b35;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .register-submit:hover {
            transform: translateY(-1px);
            background: #f25b25;
        }

        .error-message {
            background: #fff0f0;
            color: #d93025;
            border: 1px solid #ffd0d0;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .login-link a {
            color: #ff6b35;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 500px) {

            .register-card {
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>

    <div class="register-page">

        <div class="register-card">

            <div class="register-logo">

                <div class="register-logo-icon">
                    🍴
                </div>

                <h1>Create Account</h1>

                <p>Join ARMIET CanteenFlow today</p>

            </div>


            <!-- Error Message -->

            <div th:if="${error}" class="error-message">
                <span th:text="${error}"></span>
            </div>


            <!-- Registration Form -->

            <form action="/register" method="post">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter password again"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit" class="register-submit">
                    Create Account →
                </button>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>


            <div class="back-home">

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>
</html>
