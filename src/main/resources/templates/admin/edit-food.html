<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Food | ARMIET CanteenFlow</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F7F7F7;
            color: #111111;
        }

        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            height: 74px;
            background: #FFFFFF;
            border-bottom: 1px solid #E7E7E7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            color: #555555;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #E21B23;
        }

        .logout {
            color: #E21B23 !important;
        }

        /* ==============================
           MAIN
        ============================== */

        .container {
            width: 90%;
            max-width: 760px;
            margin: 45px auto 60px;
        }

        /* ==============================
           PAGE HEADER
        ============================== */

        .page-header {
            margin-bottom: 25px;
        }

        .page-label {
            display: inline-block;

            background: #FFE4E6;
            color: #B9151B;

            padding: 7px 12px;
            border-radius: 999px;

            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;

            margin-bottom: 12px;
        }

        .page-header h1 {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: #6B6B6B;
            font-size: 15px;
            line-height: 1.6;
        }

        /* ==============================
           FORM CARD
        ============================== */

        .form-card {
            background: #FFFFFF;

            border: 1px solid #E7E7E7;
            border-radius: 18px;

            padding: 32px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        /* ==============================
           FOOD ID
        ============================== */

        .food-id {
            background: #111111;
            color: #FFFFFF;

            padding: 11px 14px;

            border-radius: 10px;

            font-size: 13px;
            margin-bottom: 24px;
        }

        .food-id strong {
            color: #FFFFFF;
        }

        /* ==============================
           FORM
        ============================== */

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 800;

            margin-bottom: 8px;
            color: #222222;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #D9D9D9;
            border-radius: 10px;

            background: #FFFFFF;
            color: #111111;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #E21B23;

            box-shadow:
                0 0 0 3px rgba(226, 27, 35, 0.10);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.5;
        }

        /* ==============================
           TWO COLUMNS
        ============================== */

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* ==============================
           IMAGE / EMOJI
        ============================== */

        .emoji-input {
            font-size: 22px;
        }

        /* ==============================
           AVAILABILITY
        ============================== */

        .availability-box {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-top: 5px;

            padding: 14px 16px;

            background: #FFF7F7;
            border: 1px solid #F3D5D7;

            border-radius: 12px;
        }

        .availability-box input {
            width: 18px;
            height: 18px;

            accent-color: #E21B23;

            cursor: pointer;
        }

        .availability-box label {
            margin: 0;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        /* ==============================
           BUTTONS
        ============================== */

        .buttons {
            display: flex;
            gap: 12px;

            margin-top: 30px;
        }

        .btn {
            flex: 1;

            border: none;
            border-radius: 10px;

            padding: 14px;

            font-family: inherit;
            font-weight: 800;
            font-size: 14px;

            cursor: pointer;

            text-align: center;
            text-decoration: none;

            transition: 0.2s;
        }

        .submit-btn {
            background: #E21B23;
            color: #FFFFFF;

            box-shadow:
                0 6px 16px rgba(226, 27, 35, 0.20);
        }

        .submit-btn:hover {
            background: #B9151B;
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: #111111;
            color: #FFFFFF;
        }

        .cancel-btn:hover {
            background: #292929;
            transform: translateY(-1px);
        }

        /* ==============================
           NOTE
        ============================== */

        .form-note {
            margin-top: 20px;

            padding: 13px 15px;

            background: #F7F7F7;
            border-left: 4px solid #E21B23;

            border-radius: 8px;

            color: #666666;
            font-size: 12px;
            line-height: 1.5;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 4%;
            }

            .brand img {
                width: 52px;
                height: 52px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a:not(.logout) {
                display: none;
            }

            .container {
                width: 94%;
                margin-top: 28px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .form-card {
                padding: 22px;
                border-radius: 15px;
            }

            .two-columns {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<!-- ==============================
     NAVBAR
============================== -->

<nav class="navbar">

    <a href="/admin/dashboard"
       class="brand">

        <img
            src="/images/armiet-canteenflow-logo.png"
            alt="ARMIET CanteenFlow Logo"
        >

    </a>


    <div class="nav-links">

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/admin/orders">
            Orders
        </a>

        <a href="/admin/food">
            Food Menu
        </a>

        <a href="/logout"
           class="logout">
            Logout
        </a>

    </div>

</nav>


<!-- ==============================
     MAIN
============================== -->

<main class="container">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <span class="page-label">
            FOOD MANAGEMENT
        </span>

        <h1>
            Edit Food
        </h1>

        <p>
            Update the food item's information and availability.
        </p>

    </section>


    <!-- FORM CARD -->

    <section class="form-card">


        <!-- FOOD ID -->

        <div class="food-id">

            Food ID:

            <strong th:text="${food.id}">
                1
            </strong>

        </div>


        <!-- EDIT FORM -->

        <form action="/admin/food/edit"
              method="post">


            <input
                type="hidden"
                name="foodId"
                th:value="${food.id}"
            >


            <!-- FOOD NAME -->

            <div class="form-group">

                <label for="name">
                    Food Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    th:value="${food.name}"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    required
                    th:text="${food.description}"
                ></textarea>

            </div>


            <!-- CATEGORY + PRICE -->

            <div class="two-columns">

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option
                            value="Snacks"
                            th:selected="${food.category == 'Snacks'}"
                        >
                            Snacks
                        </option>

                        <option
                            value="Fast Food"
                            th:selected="${food.category == 'Fast Food'}"
                        >
                            Fast Food
                        </option>

                        <option
                            value="Beverages"
                            th:selected="${food.category == 'Beverages'}"
                        >
                            Beverages
                        </option>

                        <option
                            value="Meals"
                            th:selected="${food.category == 'Meals'}"
                        >
                            Meals
                        </option>

                        <option
                            value="Desserts"
                            th:selected="${food.category == 'Desserts'}"
                        >
                            Desserts
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="price">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="1"
                        step="0.01"
                        th:value="${food.price}"
                        required
                    >

                </div>

            </div>


            <!-- IMAGE / EMOJI -->

            <div class="form-group">

                <label for="imageUrl">
                    Food Emoji / Icon
                </label>

                <input
                    type="text"
                    id="imageUrl"
                    name="imageUrl"
                    class="emoji-input"
                    maxlength="10"
                    th:value="${food.image_url}"
                    placeholder="🍔"
                >

            </div>


            <!-- AVAILABILITY -->

            <div class="availability-box">

                <input
                    type="checkbox"
                    id="available"
                    name="available"
                    th:checked="${food.available == 1}"
                >

                <label for="available">
                    Food is currently available
                </label>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="/admin/food"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn submit-btn"
                >
                    Save Changes
                </button>

            </div>


            <div class="form-note">

                💡 <strong>Tip:</strong>
                Make sure the food name, price, category and availability
                are correct before saving your changes.

            </div>

        </form>

    </section>

</main>


</body>
</html>
