<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Menu | ARMIET CanteenFlow</title>

    <style>

        :root {
            --red: #E21B23;
            --red-dark: #B9151B;
            --red-light: #FFF1F2;
            --red-soft: #FFE4E6;

            --black: #111111;
            --white: #FFFFFF;

            --background: #F7F7F7;
            --border: #E7E7E7;

            --text: #171717;
            --muted: #6B6B6B;

            --green: #16834B;
            --green-light: #ECFDF3;

            --orange: #A56600;
            --orange-light: #FFF7E8;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--background);

            color: var(--text);
        }


        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            min-height: 72px;

            background: var(--white);

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 7px 6%;

            position: sticky;

            top: 0;

            z-index: 1000;

            gap: 20px;
        }


        /* ==============================
           BRAND
        ============================== */

        .brand {
            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            color: var(--black);

            flex-shrink: 0;
        }


        .brand img {
            width: 58px;

            height: 58px;

            object-fit: contain;

            display: block;
        }


        .brand-text {
            display: flex;

            flex-direction: column;
        }


        .brand-name {
            font-size: 18px;

            font-weight: 900;
        }


        .brand-name span {
            color: var(--red);
        }


        .brand-subtitle {
            color: #888;

            font-size: 11px;

            margin-top: 3px;
        }


        /* ==============================
           NAVIGATION
        ============================== */

        .nav-links {
            display: flex;

            gap: 10px;

            align-items: center;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .nav-links a {
            text-decoration: none;

            color: var(--black);

            border: 1px solid #DDDDDD;

            background: var(--white);

            padding: 9px 13px;

            border-radius: 9px;

            font-size: 12px;

            font-weight: 700;

            transition: 0.2s ease;
        }


        .nav-links a:hover {
            border-color: var(--red);

            color: var(--red);

            background: var(--red-light);
        }


        .nav-links .logout {
            color: var(--red);

            border-color: #F2C8CA;
        }


        .nav-links .logout:hover {
            background: var(--red);

            color: white;

            border-color: var(--red);
        }


        /* ==============================
           MAIN
        ============================== */

        .container {
            width: 90%;

            max-width: 1250px;

            margin: 40px auto 70px;
        }


        /* ==============================
           HEADER
        ============================== */

        .header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }


        .header-label {
            color: var(--red);

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }


        .header h1 {
            font-size: 34px;

            line-height: 1.1;

            margin-bottom: 7px;
        }


        .header p {
            color: var(--muted);

            font-size: 14px;
        }


        /* ==============================
           ADD BUTTON
        ============================== */

        .add-btn {
            display: inline-block;

            text-decoration: none;

            background: var(--red);

            color: white;

            padding: 14px 22px;

            border-radius: 10px;

            font-weight: 700;

            transition: 0.25s ease;

            white-space: nowrap;
        }


        .add-btn:hover {
            background: var(--red-dark);

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(226, 27, 35, 0.18);
        }


        /* ==============================
           FOOD GRID
        ============================== */

        .food-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        /* ==============================
           FOOD CARD
        ============================== */

        .food-card {
            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.05);

            transition: 0.25s ease;
        }


        .food-card:hover {
            transform: translateY(-3px);

            border-color: #F0C5C7;

            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.07);
        }


        /* ==============================
           FOOD TOP
        ============================== */

        .food-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 12px;
        }


        /* ==============================
           FOOD ICON
        ============================== */

        .food-icon {
            width: 58px;

            height: 58px;

            border-radius: 14px;

            background: var(--red-light);

            border: 1px solid #FFD4D6;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 29px;

            overflow: hidden;
        }


        /* ==============================
           AVAILABILITY
        ============================== */

        .availability {
            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;
        }


        .available {
            background: var(--green-light);

            color: var(--green);

            border: 1px solid #C9F0D8;
        }


        .unavailable {
            background: var(--red-light);

            color: var(--red);

            border: 1px solid #FFD4D6;
        }


        /* ==============================
           FOOD DETAILS
        ============================== */

        .food-name {
            font-size: 20px;

            font-weight: 800;

            margin-top: 18px;
        }


        .food-category {
            color: var(--red);

            font-size: 12px;

            font-weight: 700;

            margin-top: 5px;
        }


        .food-description {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;

            margin-top: 10px;

            min-height: 40px;
        }


        /* ==============================
           FOOD BOTTOM
        ============================== */

        .food-bottom {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 20px;

            padding-top: 16px;

            border-top: 1px solid var(--border);

            gap: 10px;
        }


        .price {
            font-size: 22px;

            font-weight: 800;

            white-space: nowrap;

            color: var(--black);
        }


        .price span:first-child {
            color: var(--red);
        }


        /* ==============================
           ACTIONS
        ============================== */

        .actions {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .action-btn {
            border: none;

            padding: 8px 11px;

            border-radius: 8px;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .edit-btn {
            background: var(--black);

            color: white;
        }


        .edit-btn:hover {
            background: var(--red);
        }


        .toggle-btn {
            background: var(--orange-light);

            color: var(--orange);
        }


        .toggle-btn:hover {
            background: #FFEBC4;
        }


        .delete-btn {
            background: var(--red-light);

            color: var(--red);
        }


        .delete-btn:hover {
            background: var(--red);

            color: white;
        }


        /* ==============================
           EMPTY
        ============================== */

        .empty {
            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 60px 20px;

            text-align: center;

            color: var(--muted);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.04);
        }


        .empty h2 {
            color: var(--black);
        }


        .back-btn {
            display: inline-block;

            margin-top: 28px;

            text-decoration: none;

            background: var(--black);

            color: white;

            padding: 12px 18px;

            border-radius: 10px;

            font-weight: 700;

            transition: 0.2s ease;
        }


        .back-btn:hover {
            background: var(--red);
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 1000px) {

            .food-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 750px) {

            .navbar {
                align-items: flex-start;

                flex-direction: column;

                padding-top: 8px;

                padding-bottom: 8px;
            }


            .nav-links {
                width: 100%;

                justify-content: flex-start;
            }


            .header {
                align-items: flex-start;

                flex-direction: column;
            }

        }


        @media (max-width: 650px) {

            .navbar {
                padding-left: 4%;

                padding-right: 4%;
            }


            .brand img {
                width: 52px;

                height: 52px;
            }


            .brand-name {
                font-size: 16px;
            }


            .brand-subtitle {
                display: none;
            }


            .nav-links a:not(.logout) {
                display: none;
            }


            .container {
                width: 94%;

                margin-top: 25px;
            }


            .header h1 {
                font-size: 28px;
            }


            .food-grid {
                grid-template-columns: 1fr;
            }


            .food-bottom {
                align-items: flex-start;

                flex-direction: column;
            }


            .actions {
                width: 100%;

                justify-content: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- ==============================
     NAVBAR
============================== -->

<nav class="navbar">


    <a
        href="/admin/dashboard"
        class="brand">


        <img
            src="/images/armiet-canteenflow-logo.png"
            alt="ARMIET CanteenFlow Logo"
        >


        <div class="brand-text">

            <span class="brand-name">
                ARMIET <span>CanteenFlow</span>
            </span>


            <span class="brand-subtitle">
                Admin Panel
            </span>

        </div>

    </a>


    <div class="nav-links">


        <a href="/admin/dashboard">
            Dashboard
        </a>


        <a href="/admin/orders">
            Orders
        </a>


        <a href="/admin/food">
            Food Menu
        </a>


        <a href="/logout"
           class="logout">

            Logout

        </a>

    </div>

</nav>


<!-- ==============================
     MAIN
============================== -->

<main class="container">


    <!-- ==============================
         HEADER
    ============================== -->

    <section class="header">


        <div>

            <div class="header-label">
                MENU MANAGEMENT
            </div>


            <h1>
                Food Menu
            </h1>


            <p>
                Manage food items, prices and availability.
            </p>

        </div>


        <a
            href="/admin/food/add"
            class="add-btn">

            + Add Food

        </a>

    </section>


    <!-- ==============================
         FOOD GRID
    ============================== -->

    <section
        class="food-grid"
        th:if="${not #lists.isEmpty(foodItems)}">


        <article
            class="food-card"
            th:each="food : ${foodItems}">


            <!-- FOOD TOP -->

            <div class="food-top">


                <div class="food-icon">

                    <span
                        th:if="${food.image_url == null or food.image_url == ''}">

                        &#127860;

                    </span>


                    <span
                        th:if="${food.image_url != null and food.image_url != ''}"
                        th:text="${food.image_url}">

                        &#127860;

                    </span>

                </div>


                <span
                    class="availability"
                    th:classappend="${food.available == 1 ? ' available' : ' unavailable'}"
                    th:text="${food.available == 1 ? 'AVAILABLE' : 'UNAVAILABLE'}">

                    AVAILABLE

                </span>

            </div>


            <!-- FOOD NAME -->

            <div
                class="food-name"
                th:text="${food.name}">

                Vada Pav

            </div>


            <!-- CATEGORY -->

            <div
                class="food-category"
                th:text="${food.category}">

                Snacks

            </div>


            <!-- DESCRIPTION -->

            <div
                class="food-description"
                th:text="${food.description}">

                Delicious food item.

            </div>


            <!-- BOTTOM -->

            <div class="food-bottom">


                <div class="price">

                    <span>&#8377;</span>

                    <span
                        th:text="${food.price}">

                        20

                    </span>

                </div>


                <div class="actions">


                    <!-- EDIT -->

                    <a
                        th:href="@{'/admin/food/edit/' + ${food.id}}"
                        class="action-btn edit-btn"
                        style="text-decoration:none;">

                        Edit

                    </a>


                    <!-- TOGGLE AVAILABILITY -->

                    <form
                        action="/admin/food/toggle"
                        method="post"
                        style="display:inline;">


                        <input
                            type="hidden"
                            name="foodId"
                            th:value="${food.id}">


                        <button
                            type="submit"
                            class="action-btn toggle-btn">


                            <span
                                th:if="${food.available == 1}">

                                Make Unavailable

                            </span>


                            <span
                                th:if="${food.available == 0}">

                                Make Available

                            </span>


                        </button>

                    </form>


                    <!-- DELETE FOOD -->

                    <form
                        action="/admin/food/delete"
                        method="post"
                        style="display:inline;"
                        onsubmit="return confirm('Are you sure you want to delete this food item?');">


                        <input
                            type="hidden"
                            name="foodId"
                            th:value="${food.id}">


                        <button
                            type="submit"
                            class="action-btn delete-btn">

                            Delete

                        </button>

                    </form>


                </div>

            </div>

        </article>

    </section>


    <!-- ==============================
         EMPTY MENU
    ============================== -->

    <section
        class="empty"
        th:if="${#lists.isEmpty(foodItems)}">


        <h2>
            No food items found
        </h2>


        <p style="margin-top:8px;">

            Add food items to your canteen menu.

        </p>

    </section>


    <!-- BACK -->

    <a
        href="/admin/dashboard"
        class="back-btn">

        ← Back to Dashboard

    </a>

</main>


</body>

</html>
